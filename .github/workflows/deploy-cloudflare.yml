name: Deploy to Cloudflare

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '*.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# Avoid two deploys racing each other; let an in-flight deploy finish before
# starting the next one rather than cancelling it mid-way.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ubuntu-latest runners ship Docker preinstalled and running, which
      # `wrangler deploy` needs to build the Container image (see Dockerfile).
      - name: Deploy Worker + Container
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
